name: puzzlenetdesk Release Build

# Builds the puzzlenetdesk-branded Windows + Android clients (and the other
# upstream platforms) and publishes them as a prerelease.
# Triggered by pushing to the `release` branch (tags cannot be pushed via the
# GitHub App, so the branch is the trigger). The release tag is
# v1.5.1-puzzlenetdesk1; it intentionally does not match flutter-tag.yml's
# vX.Y.Z-N pattern, so no second build is triggered when the release is made.
on:
  push:
    branches:
      - release
  workflow_dispatch:

# The repo's default GITHUB_TOKEN permission is contents: read. A caller
# workflow's permissions are the ceiling for the reusable workflow it calls,
# and flutter-build.yml's generate-sbom / publish-signed-update-metadata jobs
# request contents: write — without this the run fails at startup.
permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: v1.5.1-puzzlenetdesk1
      publish-update-metadata: false
